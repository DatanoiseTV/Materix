name: F-Droid repo

# Publish a self-hosted F-Droid repository to GitHub Pages (Threema-style) by
# REUSING an already-built Android APK instead of rebuilding it here. The APK is
# pulled from the most recent successful "Android build" run (android.yml), so
# this job does no Rust/NDK/Tauri compilation — it only signs, indexes, and
# deploys. That keeps CI minutes/credits low.
#
# The repository accumulates every version it publishes (older APKs are restored
# from the live repo and re-indexed), so F-Droid users can update AND downgrade.
#
# The repo URL is derived from whichever repo runs this workflow (its GitHub
# Pages project site), so it works unmodified on upstream and on any fork. Users
# add
#   https://<owner>.github.io/<repo>/fdroid/repo/?fingerprint=<FP>
# to their F-Droid client and get installs + auto-updates. Override the URL with
# an Actions variable FDROID_REPO_URL if publishing under a custom domain.
#
# Requires three repo secrets (set them once — see packaging/fdroid/SELFHOSTED.md):
#   FDROID_KEYSTORE_B64   base64 of the PKCS12 keystore
#   FDROID_KEYSTORE_PASS  keystore password
#   FDROID_KEY_ALIAS      key alias (materix)
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Android build run id to reuse the APK from (blank = latest successful)"
        required: false
        default: ""
  release:
    types: [published]

permissions:
  contents: read
  actions: read      # read + download artifacts from the Android build run
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  publish:
    name: Publish F-Droid repo (reuse prebuilt APK)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Workflow file + artifact name produced by the Android build.
      ANDROID_WORKFLOW: android.yml
      APK_ARTIFACT: materix-android-apk
    steps:
      - uses: actions/checkout@v4

      - name: Resolve F-Droid repo URL (works on any fork)
        env:
          # Optional override: set an Actions variable FDROID_REPO_URL (repo or
          # org level) to publish under a custom domain / path. Left unset, the
          # URL is derived from this very repo's GitHub Pages project site, so
          # the workflow works unmodified on upstream and on any fork.
          OVERRIDE_URL: ${{ vars.FDROID_REPO_URL }}
        run: |
          set -euo pipefail
          if [ -n "$OVERRIDE_URL" ]; then
            URL="$OVERRIDE_URL"
          else
            # Pages hostnames are lowercase; the project path keeps the repo
            # name's case (e.g. https://datanoisetv.github.io/Materix/...).
            OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
            NAME="${GITHUB_REPOSITORY#*/}"
            URL="https://${OWNER}.github.io/${NAME}/fdroid/repo"
          fi
          URL="${URL%/}"
          echo "REPO_URL=$URL" >> "$GITHUB_ENV"
          echo "F-Droid repo URL: $URL"

      # apksigner + fdroidserver need a JDK. No Node/Rust/NDK/Tauri toolchain.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Resolve Android build run to reuse
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RID="${{ inputs.run_id }}"
          if [ -z "$RID" ]; then
            # Default to the latest successful Android build (this branch first,
            # then repo-wide) so we always ship the most recently built APK.
            RID=$(gh run list --workflow "$ANDROID_WORKFLOW" --status success \
                    --branch "${{ github.ref_name }}" --limit 1 \
                    --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            if [ -z "$RID" ]; then
              RID=$(gh run list --workflow "$ANDROID_WORKFLOW" --status success \
                      --limit 1 --json databaseId --jq '.[0].databaseId')
            fi
          fi
          if [ -z "$RID" ]; then
            echo "::error::No successful '$ANDROID_WORKFLOW' run found. Run the Android build first."
            exit 1
          fi
          echo "run_id=$RID" >> "$GITHUB_OUTPUT"
          echo "Reusing prebuilt APK from Android build run $RID"

      - name: Download the prebuilt APK
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT }}
          run-id: ${{ steps.src.outputs.run_id }}
          github-token: ${{ github.token }}
          path: prebuilt

      - name: Restore already-published versions (enables downgrade)
        run: |
          set -euo pipefail
          mkdir -p fdroidrepo/repo
          BASE="${REPO_URL%/}"
          # Pull every APK already served by the live repo so the index we build
          # below contains the full version history — F-Droid can then offer
          # older versions for downgrade, not just the newest one.
          if curl -fsSL "$BASE/index-v2.json" -o /tmp/idx.json 2>/dev/null; then
            jq -r '.packages[].versions[].file.name' /tmp/idx.json \
              | sed 's#^/##' | sort -u | while read -r f; do
              case "$f" in
                *.apk)
                  if curl -fsSL "$BASE/$f" -o "fdroidrepo/repo/$f"; then
                    echo "restored $f"
                  else
                    echo "war: could not restore $f (skipping)"
                  fi
                  ;;
              esac
            done
          else
            echo "No existing repo index found (first publish) — starting fresh."
          fi

      - name: Sign the prebuilt APK
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/materix.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          AAPT="$BT/aapt"
          # Prefer the universal release APK; fall back to any APK in the artifact.
          UNSIGNED="$(find prebuilt -name '*universal*release*unsigned*.apk' | head -1)"
          [ -n "$UNSIGNED" ] || UNSIGNED="$(find prebuilt -name '*.apk' | head -1)"
          if [ -z "$UNSIGNED" ]; then echo "::error::No APK in the reused artifact"; exit 1; fi
          VN="$("$AAPT" dump badging "$UNSIGNED" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)"
          VC="$("$AAPT" dump badging "$UNSIGNED" | sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" | head -1)"
          if [ -z "$VC" ]; then echo "::error::Could not read versionCode from APK"; exit 1; fi
          mkdir -p fdroidrepo/repo
          # Version-stamped filename so each version is a distinct file and older
          # ones are never overwritten (the basis for downgrade support).
          OUT="fdroidrepo/repo/materix-${VN:-0}-${VC}.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/materix.p12" --ks-type PKCS12 \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "Signed $OUT (versionName=$VN versionCode=$VC)"

      - name: Build the F-Droid index
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -m pip install --quiet fdroidserver
          cd fdroidrepo
          cat > config.yml <<EOF
          repo_url: ${REPO_URL}
          repo_name: Materix
          repo_description: >-
            Self-hosted F-Droid repository for Materix, a multi-account Matrix
            client with end-to-end encryption.
          # 0 = keep every version in the main repo (no archiving) so users can
          # install or downgrade to any previously published version.
          archive_older: 0
          keystore: $RUNNER_TEMP/materix.p12
          repo_keyalias: ${KS_ALIAS}
          keystorepass: ${KS_PASS}
          keypass: ${KS_PASS}
          keydname: "CN=Materix, O=The Materix Authors"
          EOF
          chmod 600 config.yml
          # App listing metadata (fdroidserver YAML format, not AppStream XML).
          mkdir -p metadata
          cat > metadata/org.materix.app.yml <<'EOF'
          Categories:
            - Internet
          License: Apache-2.0
          AuthorName: The Materix Authors
          WebSite: ${{ github.server_url }}/${{ github.repository }}
          SourceCode: ${{ github.server_url }}/${{ github.repository }}
          IssueTracker: ${{ github.server_url }}/${{ github.repository }}/issues
          Summary: Multi-account Matrix messenger with end-to-end encryption
          Description: |-
            Materix is a multi-account Matrix client that feels like a mainstream
            messenger while staying a full Matrix client. End-to-end encryption is
            on by default for direct messages and new private rooms.
          EOF
          # Indexes every APK now present in repo/ (restored history + new one).
          fdroid update --create-metadata --verbose --pretty

      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -r fdroidrepo/repo _site/fdroid/repo
          cp packaging/fdroid/landing.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
