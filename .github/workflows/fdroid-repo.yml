name: F-Droid repo

# Build a signed Android APK and publish a self-hosted F-Droid repository to
# GitHub Pages (Threema-style). Users add
#   https://datanoisetv.github.io/Materix/fdroid/repo/?fingerprint=<FP>
# to their F-Droid client and get installs + auto-updates.
#
# Split into two jobs so the publish side can be re-run without the ~10-minute
# APK rebuild. Requires three repo secrets (see packaging/fdroid/SELFHOSTED.md):
#   FDROID_KEYSTORE_B64 / FDROID_KEYSTORE_PASS / FDROID_KEY_ALIAS
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build and sign the APK
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm
      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Build unsigned APK
        run: |
          pnpm tauri android init --ci || pnpm tauri android init
          pnpm tauri android build --apk
      - name: Sign the APK
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/materix.p12"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p out
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/materix.p12" --ks-type PKCS12 \
            --ks-pass "pass:$KS_PASS" --ks-key-alias "$KS_ALIAS" --key-pass "pass:$KS_PASS" \
            --out "out/materix-${{ github.ref_name }}.apk" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "out/materix-${{ github.ref_name }}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: signed-apk
          path: out/*.apk
          if-no-files-found: error

  publish:
    name: Build index and deploy to Pages
    needs: build-apk
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      REPO_URL: "https://datanoisetv.github.io/Materix/fdroid/repo"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: signed-apk
          path: fdroidrepo/repo
      - name: Build the F-Droid index
        env:
          KS_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
          KS_ALIAS: ${{ secrets.FDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          echo "${{ secrets.FDROID_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/materix.p12"
          python3 -m pip install --quiet fdroidserver
          cd fdroidrepo
          cat > config.yml <<EOF
          repo_url: ${REPO_URL}
          repo_name: Materix
          repo_description: >-
            Self-hosted F-Droid repository for Materix, a multi-account Matrix
            client with end-to-end encryption.
          archive_older: 0
          keystore: $RUNNER_TEMP/materix.p12
          repo_keyalias: ${KS_ALIAS}
          keystorepass: ${KS_PASS}
          keypass: ${KS_PASS}
          keydname: "CN=Materix, O=The Materix Authors"
          EOF
          chmod 600 config.yml
          mkdir -p metadata
          cat > metadata/org.materix.app.yml <<'EOF'
          Categories:
            - Internet
          License: Apache-2.0
          AuthorName: The Materix Authors
          WebSite: https://github.com/DatanoiseTV/Materix
          SourceCode: https://github.com/DatanoiseTV/Materix
          IssueTracker: https://github.com/DatanoiseTV/Materix/issues
          Summary: Multi-account Matrix messenger with end-to-end encryption
          Description: |-
            Materix is a multi-account Matrix client that feels like a mainstream
            messenger while staying a full Matrix client. End-to-end encryption is
            on by default for direct messages and new private rooms.
          EOF
          fdroid update --create-metadata --verbose --pretty
      - name: Assemble the Pages site
        run: |
          set -euo pipefail
          mkdir -p _site/fdroid
          cp -r fdroidrepo/repo _site/fdroid/repo
          cp packaging/fdroid/landing.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          timeout: 900000
