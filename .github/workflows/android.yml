name: Android build

# Manual only. Tauri Android is not yet initialized in this repo, so this build
# is expected to need iteration before it goes green. Run it from the Actions
# tab ("Run workflow") to attempt an APK on GitHub's infra without a local
# Android SDK, and read the logs to drive the fixes. Once green, the same steps
# back the F-Droid recipe in packaging/fdroid/.
on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK (unsigned)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci || pnpm tauri android init

      - name: Build APK
        run: pnpm tauri android build --apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materix-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
