name: Android build

# Manual only. Tauri Android is not yet initialized in this repo, so this build
# is expected to need iteration before it goes green. Run it from the Actions
# tab ("Run workflow") to attempt an APK on GitHub's infra without a local
# Android SDK, and read the logs to drive the fixes. Once green, the same steps
# back the F-Droid recipe in packaging/fdroid/.
on:
  workflow_dispatch:

jobs:
  android:
    name: Build Android APK (unsigned)
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "26.3.11579264"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android NDK
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci || pnpm tauri android init

      - name: Stamp version (date + commit filename, monotonic versionCode)
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short=7 HEAD)"
          DATE="$(date -u +%y%m%d)"
          VN="${DATE}_${SHA}"                       # versionName -> materix_<yymmdd>_<commit>.apk
          # Monotonic versionCode = whole minutes since 2026-01-01T00:00:00Z.
          # Small (~3e5), strictly increasing every build, fits Android's int32
          # cap for centuries. Guarantees each build outranks the previous one
          # (F-Droid always offers an update) while keeping every build distinct
          # so users can switch/downgrade between them.
          VC="$(( ( $(date -u +%s) - 1767225600 ) / 60 ))"
          GRADLE="src-tauri/gen/android/app/build.gradle.kts"
          test -f "$GRADLE" || { echo "::error::$GRADLE not found (tauri android init did not generate it)"; exit 1; }
          python3 - "$GRADLE" "$VC" "$VN" <<'PY'
          import re, sys
          path, vc, vn = sys.argv[1], sys.argv[2], sys.argv[3]
          s = open(path).read()
          s, n1 = re.subn(r'versionCode\s*=\s*[^\n]+', f'versionCode = {vc}', s)
          s, n2 = re.subn(r'versionName\s*=\s*[^\n]+', f'versionName = "{vn}"', s)
          assert n1 >= 1 and n2 >= 1, f"gradle patch failed: versionCode matches={n1} versionName matches={n2}"
          open(path, 'w').write(s)
          print(f"patched {path}: versionCode={vc} versionName={vn}")
          PY
          echo "Stamped versionName=$VN versionCode=$VC"

      - name: Patch AndroidManifest (keyboard resize)
        run: |
          set -euo pipefail
          # Force the activity into adjustResize so the soft keyboard SHRINKS the
          # WebView instead of panning it. Without this the WebView keeps full
          # height, window.visualViewport never reports the reduced height, and
          # the bottom-anchored composer stays hidden behind the keyboard — which
          # is exactly the bug the web-side viewport tracking couldn't fix alone.
          # gen/android is regenerated by `tauri android init` every run, so the
          # manifest must be patched here rather than committed.
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          test -f "$MANIFEST" || { echo "::error::$MANIFEST not found (tauri android init did not generate it)"; exit 1; }
          python3 - "$MANIFEST" <<'PY'
          import re, sys
          path = sys.argv[1]
          s = open(path).read()
          if 'windowSoftInputMode' in s:
              s, n = re.subn(r'android:windowSoftInputMode="[^"]*"',
                             'android:windowSoftInputMode="adjustResize"', s)
          else:
              # Inject into the first <activity ...> opening tag (Tauri emits a
              # single main activity).
              s, n = re.subn(r'<activity\b',
                             '<activity android:windowSoftInputMode="adjustResize"',
                             s, count=1)
          assert n >= 1, "manifest patch failed: no <activity>/windowSoftInputMode to set"
          open(path, 'w').write(s)
          print(f"patched {path}: windowSoftInputMode=adjustResize ({n} edit)")
          PY

      - name: Build APK
        run: pnpm tauri android build --apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materix-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
